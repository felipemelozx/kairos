name: SonarQube Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: apps/frontend
        run: npm test -- --coverage --watchAll=false

      - name: Run backend tests
        working-directory: apps/backend
        run: ./mvnw --batch-mode verify

      - name: Normalize frontend coverage report paths
        run: |
          sed -i -E 's|^SF:([^/])|SF:apps/frontend/\1|' apps/frontend/coverage/lcov.info

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=felipemelozx_kairos
            -Dsonar.organization=felipemelozx-trackmoney
            -Dsonar.sources=apps/frontend/src,apps/backend/src/main/java
            -Dsonar.javascript.lcov.reportPaths=apps/frontend/coverage/lcov.info
            -Dsonar.coverage.jacoco.xmlReportPaths=apps/backend/target/site/jacoco/jacoco.xml
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*Test.java,**/*Tests.java,**/KairosApplication.java
