name: Dependency Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    branches: [main]
  schedule:
    - cron: "15 1 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-scheduled:
    name: Full scan (push / schedule)
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0

  scan-pr:
    name: Scan new vulns (PR)
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0