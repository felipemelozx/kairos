name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'infrastructure/**'
      - 'docker-compose.yml'

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend JAR
        working-directory: apps/backend
        run: ./mvnw package -DskipTests

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          # Copy files to VPS
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'target' \
            --exclude '.next' \
            --exclude '.aios-core' \
            --exclude '.claude' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/kairos/

          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd /opt/kairos

            # Backup database
            docker exec kairos-postgres pg_dump -U kairos kairos_db > /opt/kairos-backups/kairos_db_$(date +%Y%m%d_%H%M%S).sql

            # Restart services
            docker-compose down
            docker-compose up -d --build

            # Wait for health check
            timeout 60s bash -c 'until docker exec kairos-backend wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health; do sleep 2; done'

            echo "Backend deployed successfully!"
          ENDSSH

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.VPS_HOST }}:8080/actuator/health || exit 1

      - name: Notify deployment success
        if: success()
        run: echo "🚀 Backend deployed successfully to ${{ secrets.VPS_HOST }}"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Backend deployment failed"
