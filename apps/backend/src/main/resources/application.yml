spring:
  application:
    name: kairos
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: email, profile

jwt:
  secret: ${JWT_SECRET:default-secret-change-in-production-min-256-bits-long-for-testing}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
